name: Build ZeroTrustAuditor

on:
  # Deliberately unfiltered. Restricting to `branches: [main]` meant a pull
  # request stacked on another branch got no CI at all -- the change was
  # reviewed and merged having never been compiled.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore test project
        run: dotnet restore tests/ZeroTrustAuditor.Tests/ZeroTrustAuditor.Tests.csproj

      - name: Run tests
        run: >
          dotnet test tests/ZeroTrustAuditor.Tests/ZeroTrustAuditor.Tests.csproj
          --configuration Release
          --logger "console;verbosity=detailed"

  build:
    name: Publish win-x64
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore ZeroTrustAuditor.csproj

      - name: Publish win-x64
        run: |
          dotnet publish ZeroTrustAuditor.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTrustAuditor-win-x64
          path: dist/
